<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Bài 10</title>
<link rel="icon" href="GD.png">
<link rel="stylesheet" href="khanhpc.css">
</head>
<body>
<h1>Piano khanhpc</h1>
<div id="piano" role="application" aria-label="Đàn piano ảo">
  <div class="white-keys">
    <div class="white-key" data-note="C4" tabindex="0"><div class="key-label">A</div></div>
    <div class="white-key" data-note="D4" tabindex="0"><div class="key-label">S</div></div>
    <div class="white-key" data-note="E4" tabindex="0"><div class="key-label">D</div></div>
    <div class="white-key" data-note="F4" tabindex="0"><div class="key-label">F</div></div>
    <div class="white-key" data-note="G4" tabindex="0"><div class="key-label">G</div></div>
    <div class="white-key" data-note="A4" tabindex="0"><div class="key-label">H</div></div>
    <div class="white-key" data-note="B4" tabindex="0"><div class="key-label">J</div></div>
    <div class="white-key" data-note="C5" tabindex="0"><div class="key-label">K</div></div>
  </div>
  <div class="black-keys">
    <div class="black-key" data-note="C#4" style="margin-left: 28px" tabindex="0"><div class="key-label">W</div></div>
    <div class="black-key" data-note="D#4" tabindex="0"><div class="key-label">E</div></div>
    <div class="black-key" data-note="F#4" style="margin-left: 50px" tabindex="0"><div class="key-label">T</div></div>
    <div class="black-key" data-note="G#4" tabindex="0"><div class="key-label">Y</div></div>
    <div class="black-key" data-note="A#4" tabindex="0"><div class="key-label">U</div></div>
  </div>
</div>
<div id="instructions">
  Sử dụng các phím trên bàn phím: A, S, D, F, G, H, J, K và W, E, T, Y, U để chơi các nốt đàn piano.<br/>
  Hỗ trợ trên trình duyệt máy tính và thiết bị di động với bàn phím ảo.
</div>
<script src="khanhpc.js"></script>
</body>
</html>
