<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Máy tính siêu đẹp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="khanhpc.css">
  <link rel="icon" href="GD.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500">
  <!-- Tiêu đề với icon và hiệu ứng màu sắc -->
  <header class="absolute top-5 left-1/2 transform -translate-x-1/2 text-white text-3xl font-semibold flex items-center space-x-3">
    <i class="fas fa-calculator text-4xl animate-pulse"></i>
    <span class="text-gradient bg-clip-text text-transparent animate-gradient">Máy tính cầm tay KHANHPC</span>
  </header>

  <audio id="clickSound" src="mouse.mp3"></audio>
  
  <div class="glass p-6 w-[24rem] space-y-4 animate-fade-in-down">
    <div id="display" class="bg-black bg-opacity-30 text-white rounded-xl p-4 text-right text-4xl font-mono h-24 overflow-auto">0</div>
    
    <div class="grid grid-cols-4 gap-3">
      <button class="btn" onclick="playSound(); clearDisplay()">C</button>
      <button class="btn" onclick="playSound(); delChar()">⌫</button>
      <button class="btn" onclick="playSound(); append('%')">%</button>
      <button class="btn btn-operator" onclick="playSound(); append('/')">÷</button>

      <button class="btn" onclick="playSound(); append('7')">7</button>
      <button class="btn" onclick="playSound(); append('8')">8</button>
      <button class="btn" onclick="playSound(); append('9')">9</button>
      <button class="btn btn-operator" onclick="playSound(); append('*')">×</button>

      <button class="btn" onclick="playSound(); append('4')">4</button>
      <button class="btn" onclick="playSound(); append('5')">5</button>
      <button class="btn" onclick="playSound(); append('6')">6</button>
      <button class="btn btn-operator" onclick="playSound(); append('-')">−</button>

      <button class="btn" onclick="playSound(); append('1')">1</button>
      <button class="btn" onclick="playSound(); append('2')">2</button>
      <button class="btn" onclick="playSound(); append('3')">3</button>
      <button class="btn btn-operator" onclick="playSound(); append('+')">+</button>

      <button class="btn" onclick="playSound(); append('00')">00</button>
      <button class="btn" onclick="playSound(); append('0')">0</button>
      <button class="btn" onclick="playSound(); append('.')">.</button>
      <button class="btn btn-equal" onclick="playSound(); calculate()">=</button>
    </div>
  </div>

  <script src="khanhpc.js"></script>
</body>


</html>
