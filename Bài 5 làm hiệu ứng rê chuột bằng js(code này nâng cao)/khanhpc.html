<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Hiệu Ứng Ánh Sáng Chuột Đa Dạng</title>
  <link rel="stylesheet" href="khanhpc.css">
  <link rel="icon" href="GD.png">
</head>
<body>
  <div id="app" aria-label="Ứng dụng hiệu ứng ánh sáng theo chuột">
    <canvas id="canvas"></canvas>
    
    <div id="controls" role="region" aria-label="Bảng điều khiển hiệu ứng ánh sáng theo chuột">
      <h2>Chọn hiệu ứng ánh sáng</h2>
      
      <div class="option-group">
        <label for="effectSelect">Loại hiệu ứng</label>
        <select id="effectSelect" aria-label="Chọn loại hiệu ứng ánh sáng">
          <option value="waterLight">Ánh sáng dòng nước</option>
          <option value="glowingOrb">Quả cầu phát sáng</option>
          <option value="ripple">Sóng lan tỏa</option>
          <option value="starTrail">Dải sao vụt sáng</option>
          <option value="firefly">Đom đóm sáng</option>
          <option value="laser">Chùm sáng laser</option>
          <option value="fireworks">Pháo hoa</option>
          <option value="neonPulse">Nhịp đèn neon</option>
          <option value="cometTail">Đuôi sao chổi</option>
          <option value="electricSparks">Tia lửa điện</option>
          <option value="galaxySwirl">Dải ngân hà xoáy</option>
          <option value="bubbleRise">Bong bóng bay</option>
          <option value="laserSweep">Chùm laser quét</option>
          <option value="auroraWave">Sóng cực quang</option>
          <option value="spiralGlow">Quầng sáng xoắn ốc</option>
          <option value="plasmaArcs">Cung plasma</option>
          <option value="twinkleStars">Sao nhấp nháy</option>
          <option value="glowingButterfly">Bướm phát sáng</option>
          <option value="rippleCircles">Vòng sóng lan tỏa</option>
        </select>
      </div>

      <div class="option-group">
        <label for="colorPicker">Màu sắc ánh sáng</label>
        <input type="color" id="colorPicker" value="#40c4ff" aria-label="Chọn màu sắc ánh sáng" />
      </div>

      <div class="option-group">
        <label for="sizeSlider">Kích thước ánh sáng</label>
        <input type="range" id="sizeSlider" min="5" max="130" value="40" aria-label="Thay đổi kích thước ánh sáng" />
      </div>

      <div class="option-group">
        <label for="intensitySlider">Cường độ sáng</label>
        <input type="range" id="intensitySlider" min="0" max="1" step="0.01" value="0.65" aria-label="Thay đổi cường độ sáng" />
      </div>

      <div class="option-group">
        <label for="speedSlider">Tốc độ hiệu ứng</label>
        <input type="range" id="speedSlider" min="0.1" max="3" step="0.05" value="1" aria-label="Thay đổi tốc độ hiệu ứng" />
      </div>

      <div class="option-group">
        <label for="spreadSlider">Độ lan tỏa</label>
        <input type="range" id="spreadSlider" min="10" max="250" value="80" aria-label="Thay đổi độ lan tỏa ánh sáng" />
      </div>

      <button id="resetBtn" aria-label="Đặt lại hiệu ứng">Đặt lại hiệu ứng</button>
    </div>

    <div id="footer">Hiệu Ứng Ánh Sáng Chuột Đa Dạng — KHANHPC</div>
  </div>

  <script src="khanhpc.js"></script>
</body>
</html>
