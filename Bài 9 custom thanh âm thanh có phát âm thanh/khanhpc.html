<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 9</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="icon" href="GD.png">
<link rel="stylesheet" href="khanhpc.css">
</head>
<body class="bg-gradient-to-br from-[#0f172a] to-[#1e293b] min-h-screen flex items-center justify-center">
  <div class="bg-[#111827] p-8 rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.5)] w-full max-w-md text-white relative overflow-hidden">
    <div class="absolute -top-10 -left-10 w-36 h-36 bg-cyan-500 rounded-full blur-3xl opacity-30 animate-pulse"></div>
    <div class="absolute -bottom-10 -right-10 w-36 h-36 bg-green-400 rounded-full blur-3xl opacity-20 animate-pulse"></div>
    <h2 class="text-2xl font-bold text-center mb-6">🎶Trình điều khiển âm thanh KHANHPC</h2>
    <!--Nút phát âm thannh -->
    <div class="flex items-center justify-center mb-6">
      <button id="togglePlay" class="text-4xl text-green-400 hover:scale-110 transition-transform duration-200 playPauseBtn">
        <i id="playPauseIcon" class="fas fa-play-circle"></i>
      </button>
    </div>

    <!--Chọn âm thanh -->
    <div class="mb-6">
      <select id="audioSelector" class="w-full p-2 bg-[#111827] text-white border border-gray-600 rounded-md focus:outline-none">
        <option value="1">Âm thanh Biển Cả</option>
        <option value="2">Âm thanh Rừng Xanh</option>
        <option value="3">Âm thanh Mưa Rơi</option>
        <option value="4">Âm thanh Sóng Vỗ</option>
        <option value="5">Âm thanh Nhạc Chill</option>
        <option value="6">Âm thanh Bão Tố</option>
      </select>
    </div>
    <!--thanh điều khiển-->
    <div class="flex items-center gap-4 mb-2">
            <i id="volumeIcon" class="fas fa-volume-up text-2xl text-cyan-400"></i>
      <input type="range" id="volumeSlider" min="0" max="100" value="50">
      <span id="volumeValue" class="text-lg font-semibold text-cyan-400 w-14 text-right">50%</span>
    </div>
    <!--Âm thanh -->
    <audio id="sampleAudio" loop>
      <source id="audioSource" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>
    </div>
    <script src="khanhpc.js"></script>
</body>
</html>
