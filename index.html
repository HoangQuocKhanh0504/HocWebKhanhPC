<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="GD.png">
  <title>Hocwebkhanhpc</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #f0f0f0;
      --bg-dark: #1f1f1f;
      --text-light: #333;
      --text-dark: #eee;
      --card-light: #fff;
      --card-dark: #2a2a2a;
      --shadow: rgba(0, 0, 0, 0.1);
      --primary: #4f46e5;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-light);
      padding: 30px;
      margin: 0;
      transition: all 0.3s ease-in-out;
    }

    .dark-mode {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    h1 {
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 30px;
    }

    ul {
      max-width: 700px;
      margin: auto;
      padding: 0;
      list-style: none;
    }

    li {
      background: var(--card-light);
      margin: 12px 0;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px var(--shadow);
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    .dark-mode li {
      background: var(--card-dark);
    }

    li:hover {
      transform: translateY(-3px);
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      word-break: break-all;
    }

    a:hover {
      text-decoration: underline;
    }

    .toggle-mode {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      transition: background 0.3s;
    }

    .toggle-mode:hover {
      background: #3730a3;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      h1 {
        font-size: 1.6rem;
      }

      li {
        padding: 12px 16px;
      }

      .toggle-mode {
        padding: 8px 12px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <button class="toggle-mode" onclick="toggleDarkMode()">🌙 Chế độ tối</button>
  <h1>📄 Danh sách file HTML - Hocwebkhanhpc</h1>
  <ul id="file-list">Đang tải...</ul>

  <script>
    const user = "HoangQuocKhanh0504";
    const repo = "hocwebkhanhpc";
    const branch = "root";

    async function fetchHtmlFiles() {
      try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/git/trees/${branch}?recursive=1`);
        const data = await res.json();

        const htmlFiles = data.tree.filter(file => file.path.endsWith(".html"));
        const list = document.getElementById("file-list");
        list.innerHTML = "";

        if (htmlFiles.length === 0) {
          list.innerHTML = "<li>Không tìm thấy file HTML nào.</li>";
          return;
        }

        htmlFiles.forEach(file => {
          const li = document.createElement("li");
          const link = document.createElement("a");

          link.href = `https://${user}.github.io/${repo}/${file.path}`;
          link.textContent = file.path;
          link.target = "_blank";

          li.appendChild(link);
          list.appendChild(li);
        });
      } catch (error) {
        document.getElementById("file-list").innerHTML = "<li>Lỗi khi tải danh sách file. Kiểm tra kết nối hoặc tên nhánh.</li>";
        console.error(error);
      }
    }

    fetchHtmlFiles();

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }
  </script>
</body>
</html>
