<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="GD.png" />
  <title>Hocwebkhanhpc</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f4f6;
      --bg-dark: #1e1e2f;
      --card: #ffffff;
      --card-dark: #2a2a40;
      --text: #111827;
      --text-dark: #e5e7eb;
      --primary: #6366f1;
      --hover: #4f46e5;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      transition: all 0.4s ease;
    }

    body.dark {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 40px;
      animation: fadeInDown 1s ease;
    }

    ul {
      list-style: none;
      max-width: 800px;
      margin: auto;
      padding: 0;
    }

    li {
      background-color: var(--card);
      margin: 15px 0;
      padding: 18px 24px;
      border-radius: 14px;
      box-shadow: 0 6px 15px var(--shadow);
      transform: translateY(20px);
      opacity: 0;
      animation: fadeInUp 0.6s ease forwards;
      animation-delay: calc(var(--i) * 0.1s);
      text-align: center;
    }

    body.dark li {
      background-color: var(--card-dark);
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
      font-size: 1.4rem;
      display: inline-block;
      transition: all 0.3s ease;
    }

    a:hover {
      color: var(--hover);
      transform: scale(1.1);
    }

    .toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.4s ease;
    }

    .toggle-btn.rotate {
      transform: rotate(180deg);
    }

    @keyframes fadeInUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeInDown {
      from {
        transform: translateY(-20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }

      li {
        padding: 14px 18px;
      }

      .toggle-btn {
        font-size: 1.5rem;
        top: 10px;
        right: 10px;
      }
    }
  </style>
</head>
<body>
  <button class="toggle-btn" id="theme-toggle" onclick="toggleDark()">💡</button>
  <h1>📁 Bài học hôm nay</h1>
  <ul id="file-list">Đang tải...</ul>

  <script>
    const user = "HoangQuocKhanh0504";
    const repo = "hocwebkhanhpc";
    const branch = "root";

    async function fetchHtmlFiles() {
      try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/git/trees/${branch}?recursive=1`);
        const data = await res.json();

        // Kiểm tra nếu 'data.tree' là một mảng hợp lệ
        if (!Array.isArray(data.tree)) {
          throw new Error('Dữ liệu không hợp lệ.');
        }

        // Lọc tất cả các file có phần mở rộng .html
        const htmlFiles = data.tree.filter(file => file.path.endsWith(".html"));
        const list = document.getElementById("file-list");
        list.innerHTML = "";

        if (htmlFiles.length === 0) {
          list.innerHTML = "<li>Không tìm thấy file HTML nào.</li>";
          return;
        }

        const folders = new Set();
        htmlFiles.forEach(file => {
          // Lấy thư mục chứa file HTML
          const folder = file.path.includes('/') ? file.path.split('/').slice(0, -1).join('/') : "";
          if (folder) folders.add(folder);
        });

        // Sắp xếp thư mục theo thứ tự số
        const sortedFolders = Array.from(folders).sort((a, b) => {
          const numA = a.match(/\d+/) ? parseInt(a.match(/\d+/)[0]) : 0;
          const numB = b.match(/\d+/) ? parseInt(b.match(/\d+/)[0]) : 0;
          return numA - numB;
        });

        sortedFolders.forEach((folder, index) => {
          const li = document.createElement("li");
          li.style.setProperty('--i', index);

          const a = document.createElement("a");
          a.href = `https://${user}.github.io/${repo}/${folder === "" ? "" : folder + "/"}khanhpc.html`;
          a.textContent = `📁 ${folder}`;
          a.target = "_blank";

          li.appendChild(a);
          list.appendChild(li);
        });
      } catch (e) {
        console.error(e);
        document.getElementById("file-list").innerHTML = "<li>Lỗi khi tải danh sách file.</li>";
      }
    }

    function toggleDark() {
      const body = document.body;
      const btn = document.getElementById("theme-toggle");
      body.classList.toggle("dark");
      btn.classList.toggle("rotate");

      // Lưu trạng thái chế độ sáng tối vào localStorage
      if (body.classList.contains("dark")) {
        localStorage.setItem("theme", "dark");
        btn.textContent = "💡";
      } else {
        localStorage.setItem("theme", "light");
        btn.textContent = "🌙";
      }
    }

    // Kiểm tra chế độ sáng tối khi tải lại trang
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
      document.getElementById("theme-toggle").textContent = "🌙";
    }

    fetchHtmlFiles();
  </script>
</body>
</html>
