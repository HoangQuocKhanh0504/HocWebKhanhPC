<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Danh sách HTML trong repo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: white;
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    a {
      color: #007bff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>📄 Danh sách file HTML trong repo</h1>
  <ul id="file-list">Đang tải...</ul>

  <script>
    const user = "USERNAME"; // Thay bằng tên GitHub
    const repo = "REPO";     // Thay bằng tên repo
    const branch = "main";   // Hoặc 'master'

    async function fetchHtmlFiles() {
      const res = await fetch(`https://api.github.com/repos/${user}/${repo}/git/trees/${branch}?recursive=1`);
      const data = await res.json();
      const htmlFiles = data.tree.filter(file => file.path.endsWith(".html"));

      const list = document.getElementById("file-list");
      list.innerHTML = "";

      htmlFiles.forEach(file => {
        const li = document.createElement("li");
        const link = document.createElement("a");
        link.href = `https://${user}.github.io/${repo}/${file.path}`;
        link.textContent = file.path;
        link.target = "_blank";
        li.appendChild(link);
        list.appendChild(li);
      });

      if (htmlFiles.length === 0) {
        list.innerHTML = "<li>Không tìm thấy file HTML nào.</li>";
      }
    }

    fetchHtmlFiles();
  </script>
</body>
</html>
