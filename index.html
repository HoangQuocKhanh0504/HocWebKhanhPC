<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="GD.png">
  <title>Hocwebkhanhpc</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #fff;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    a {
      text-decoration: none;
      color: #007bff;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>📄 Hocwebkhanhpc</h1>
  <ul id="file-list">Đang tải...</ul>

  <script>
    const user = "HoangQuocKhanh0504";
    const repo = "hocwebkhanhpc";
    const branch = "root";

    async function fetchHtmlFiles() {
      try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/git/trees/${branch}?recursive=1`);
        const data = await res.json();

        const htmlFiles = data.tree.filter(file => file.path.endsWith(".html"));

        const list = document.getElementById("file-list");
        list.innerHTML = "";

        if (htmlFiles.length === 0) {
          list.innerHTML = "<li>Không tìm thấy file HTML nào.</li>";
          return;
        }

        htmlFiles.forEach(file => {
          const li = document.createElement("li");
          const link = document.createElement("a");

          link.href = `https://${user}.github.io/${repo}/${file.path}`;
          link.textContent = file.path;
          link.target = "_blank";

          li.appendChild(link);
          list.appendChild(li);
        });
      } catch (error) {
        document.getElementById("file-list").innerHTML = "<li>Lỗi khi tải danh sách file. Kiểm tra kết nối hoặc tên nhánh.</li>";
        console.error(error);
      }
    }

    fetchHtmlFiles();
  </script>
</body>
</html>
